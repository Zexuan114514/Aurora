<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Aurora · 按钮模板预览（画廊）</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0; padding: 36px 44px;
        background: #f1f1ef; color: #0e0f12;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
      p.note { margin: 0 0 26px; font-size: 12.5px; color: rgba(14, 15, 18, 0.6); }
      section { margin-bottom: 30px; }
      h2 {
        font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
        color: rgba(14, 15, 18, 0.55); font-weight: 600; margin: 0 0 12px;
        padding-bottom: 8px; border-bottom: 1px solid rgba(14, 15, 18, 0.14);
      }
      .row { display: flex; align-items: center; gap: 26px; flex-wrap: wrap; }
      .cell { display: flex; flex-direction: column; gap: 8px; }
      .cell b {
        font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
        color: rgba(14, 15, 18, 0.45); font-weight: 600;
      }
      .card {
        padding: 22px 24px; border-radius: 1px;
        background: #fdfcfa; border: 1px solid rgba(14, 15, 18, 0.12);
      }

      /* ---- 模板 1：一般按钮（原样式，未改） ---- */
      .button-name {
        align-items: center;
        appearance: none;
        background-color: #fcfcfd;
        border-radius: 4px;
        border-width: 0;
        box-shadow:
          rgba(45, 35, 66, 0.2) 0 2px 4px,
          rgba(45, 35, 66, 0.15) 0 7px 13px -3px,
          #d6d6e7 0 -3px 0 inset;
        box-sizing: border-box;
        color: #36395a;
        cursor: pointer;
        display: inline-flex;
        height: 48px;
        justify-content: center;
        line-height: 1;
        list-style: none;
        overflow: hidden;
        padding-left: 16px;
        padding-right: 16px;
        position: relative;
        text-align: left;
        text-decoration: none;
        transition: box-shadow 0.15s, transform 0.15s;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
        white-space: nowrap;
        will-change: box-shadow, transform;
        font-size: 18px;
      }
      .button-name:focus,
      .button-name.is-hover {
        box-shadow:
          #d6d6e7 0 0 0 1.5px inset,
          rgba(45, 35, 66, 0.4) 0 2px 4px,
          rgba(45, 35, 66, 0.3) 0 7px 13px -3px,
          #d6d6e7 0 -3px 0 inset;
      }
      .button-name:hover,
      .button-name.is-hover {
        box-shadow:
          rgba(45, 35, 66, 0.3) 0 4px 8px,
          rgba(45, 35, 66, 0.2) 0 7px 13px -3px,
          #d6d6e7 0 -3px 0 inset;
        transform: translateY(-2px);
      }
      .button-name:active,
      .button-name.is-active {
        box-shadow: #d6d6e7 0 3px 7px inset;
        transform: translateY(2px);
      }

      /* ---- 模板 2：启动游戏按钮（原样式，未改） ---- */
      .button-with-icon {
        overflow: hidden;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #0f988e;
        font-family: "Istok Web", sans-serif;
        letter-spacing: 1px;
        padding: 0 12px;
        text-align: center;
        width: 120px;
        height: 40px;
        font-size: 14px;
        text-transform: uppercase;
        font-weight: normal;
        border-radius: 3px;
        outline: none;
        user-select: none;
        cursor: pointer;
        transform: translateY(0px);
        position: relative;
        box-shadow:
          inset 0 30px 30px -15px rgba(255, 255, 255, 0.1),
          inset 0 0 0 1px rgba(255, 255, 255, 0.3),
          inset 0 1px 20px rgba(0, 0, 0, 0),
          0 3px 0 #0f988e,
          0 3px 2px rgba(0, 0, 0, 0.2),
          0 5px 10px rgba(0, 0, 0, 0.1),
          0 10px 20px rgba(0, 0, 0, 0.1);
        background: #15ccbe;
        color: white;
        text-shadow: 0 1px 0 rgba(0, 0, 0, 0.3);
        transition: 150ms all ease-in-out;
      }
      .button-with-icon .icon {
        margin-right: 8px;
        width: 24px;
        height: 24px;
        transition: all 0.5s ease-in-out;
      }
      .button-with-icon:active,
      .button-with-icon.is-active {
        transform: translateY(3px);
        box-shadow:
          inset 0 16px 2px -15px rgba(0, 0, 0, 0),
          inset 0 0 0 1px rgba(255, 255, 255, 0.15),
          inset 0 1px 20px rgba(0, 0, 0, 0.1),
          0 0 0 #0f988e,
          0 0 0 2px rgba(255, 255, 255, 0.5),
          0 0 0 rgba(0, 0, 0, 0),
          0 0 0 rgba(0, 0, 0, 0);
      }
      .button-with-icon:hover .text,
      .button-with-icon.is-hover .text { transform: translateX(80px); }
      .button-with-icon:hover .icon,
      .button-with-icon.is-hover .icon { transform: translate(23px); }
      .text { transition: all 0.5s ease-in-out; }
    </style>
  </head>
  <body>
    <h1>按钮模板预览 · 展签式画廊</h1>
    <p class="note">
      原样式原样渲染（未改色 / 未改圆角）。悬停与按下用类名模拟（headless 里没法真的悬停）。
      落地到应用时的取舍见同目录 README 与两个 .vue 的头部注释。
    </p>

    <section class="card">
      <h2>一般按钮（启动游戏按钮除外）</h2>
      <div class="row">
        <div class="cell"><b>默认</b><button class="button-name">Button-name</button></div>
        <div class="cell"><b>悬停</b><button class="button-name is-hover">Button-name</button></div>
        <div class="cell"><b>按下</b><button class="button-name is-active">Button-name</button></div>
      </div>
    </section>

    <section class="card">
      <h2>启动游戏按钮</h2>
      <div class="row">
        <div class="cell">
          <b>默认</b>
          <button class="button-with-icon">
            <svg class="icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
              <path fill="#ffffff" d="M12 39c-.549 0-1.095-.15-1.578-.447A3.008 3.008 0 0 1 9 36V12c0-1.041.54-2.007 1.422-2.553a3.014 3.014 0 0 1 2.919-.132l24 12a3.003 3.003 0 0 1 0 5.37l-24 12c-.42.21-.885.315-1.341.315z"></path>
            </svg>
            <span class="text">Play</span>
          </button>
        </div>
        <div class="cell">
          <b>悬停（文字滑出、图标右移）</b>
          <button class="button-with-icon is-hover">
            <svg class="icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
              <path fill="#ffffff" d="M12 39c-.549 0-1.095-.15-1.578-.447A3.008 3.008 0 0 1 9 36V12c0-1.041.54-2.007 1.422-2.553a3.014 3.014 0 0 1 2.919-.132l24 12a3.003 3.003 0 0 1 0 5.37l-24 12c-.42.21-.885.315-1.341.315z"></path>
            </svg>
            <span class="text">Play</span>
          </button>
        </div>
        <div class="cell">
          <b>按下</b>
          <button class="button-with-icon is-active">
            <svg class="icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
              <path fill="#ffffff" d="M12 39c-.549 0-1.095-.15-1.578-.447A3.008 3.008 0 0 1 9 36V12c0-1.041.54-2.007 1.422-2.553a3.014 3.014 0 0 1 2.919-.132l24 12a3.003 3.003 0 0 1 0 5.37l-24 12c-.42.21-.885.315-1.341.315z"></path>
            </svg>
            <span class="text">Play</span>
          </button>
        </div>
      </div>
    </section>
  </body>
</html>

name: 问题反馈
description: 用起来不对劲、闪退、翻译不出来……先导一份诊断包再提，能省掉好几轮问答
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: |
        **提之前请先做两件事：**

        1. 翻一遍 [手册的常见问题](https://github.com/Zexuan114514/Aurora/blob/main/docs/manual/README.md#常见问题)；
        2. 设置 → 关于 → **导出诊断包**（或命令行 `python tools\collect_diagnostics.py`），
           把生成的 zip 附在下面。里面只有脱敏设置、日志尾巴、插件与资料源状态，不含游戏文件与素材原图。
  - type: textarea
    id: what_happened
    attributes:
      label: 现象
      description: 实际发生了什么；有报错就把原文贴全
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从双击 Aurora.exe 开始，一步一步写
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: dropdown
    id: reproducible
    attributes:
      label: 每次都会出现吗
      options:
        - "每次都出现"
        - "偶尔出现"
        - "只出现过一次"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Aurora 版本
      description: 设置 → 关于里的版本号，或 Release 的 tag
      placeholder: "1.0.0"
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断包
      description: 把导出出来的 zip 拖进来（必填）。没附诊断包的问题通常只能靠猜，会被挂起等补充
      placeholder: 拖拽 zip 到这里上传
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: 截图 / 日志 / 其它线索
      description: 截图、`data\logs\aurora.log` 片段、游戏名与引擎名（如果和翻译/启动有关）
    validations:
      required: false

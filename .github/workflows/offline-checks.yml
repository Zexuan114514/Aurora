name: offline-checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 离线检查（无需依赖，纯标准库）
        run: python tools\checks\run_all.py --json checks-result.json

      - name: 安装开发依赖
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: pytest 套件
        run: python -m pytest

      - name: 上传检查结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-checks-result
          path: checks-result.json
          if-no-files-found: ignore

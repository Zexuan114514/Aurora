name: offline-checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 离线检查（无需依赖，纯标准库）
        run: python tools\checks\run_all.py --json checks-result.json

      - name: 打包 dry-run（前端清单 / 图标 / 规则包 / 动态声明）
        run: python tools\build_exe.py --dry-run

      - name: 安装开发依赖
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: pytest 套件
        run: python -m pytest

      - name: 迁移与数据 v2 用例（v1→v2 全等 / 干跑 / 去抖 / 损坏恢复 / 回滚）
        run: python -m pytest tests\test_state_store.py -q

      - name: 诊断包（P7，输出到工作区供上传）
        run: python tools\collect_diagnostics.py --out diagnostics-ci.zip

      - name: 上传检查结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-checks-result
          path: |
            checks-result.json
            diagnostics-ci.zip
          if-no-files-found: ignore

  # 前端（v2）：类型检查 + 单测。产物本身由主 job 的 check_frontend_build 守（纯 Python），
  # 这个 job 只负责「源码级」的检查，所以离线 job 不需要装 Node。
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 类型检查（vue-tsc）
        working-directory: frontend
        run: npm run typecheck

      - name: 单元测试（vitest：环几何 / 查询 / 时间 / 主题契约）
        working-directory: frontend
        run: npm test
